[project]
name = "mato"
version = "0.1.0"
description = "MATO: Multi-Objective Alignment with Test-time Optimization"
authors = [
    {name = "Linhao Luo", email = "Linhao.Luo@monash.edu"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.14"
dependencies = [
    "transformers>=4.50",
    "datasets>=4.0",
    "accelerate>=1.0",
    "peft>=0.10",
    "moocore>=0.1.10",
    "matplotlib>=3.8",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "python-dotenv>=1.0",
    "tqdm",
    "numpy",
    "torch",
]

[tool.poetry]
packages = [{include = "mato", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
